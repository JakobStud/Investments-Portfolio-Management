[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "investment-portfolio-lab"
version = "0.1.0"
description = "Environment scaffold for a personal investment portfolio learning lab"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Jakob Stud" }
]
dependencies = [
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "scipy>=1.13.0",
  "statsmodels>=0.14.0",
  "scikit-learn>=1.5.0",
  "matplotlib>=3.9.0",
  "seaborn>=0.13.0",
  "plotly>=5.24.0",
  "yfinance>=0.2.0",
  "requests>=2.32.0",
  "pyyaml>=6.0.0",
  "jupyter>=1.1.0",
  "pytest>=8.3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "jupyter>=1.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_lab"]
